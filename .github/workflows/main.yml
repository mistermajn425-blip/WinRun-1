name: Build WinRun APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Восстановить кэш Buildozer
        uses: actions/cache/restore@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            buildozer-${{ hashFiles('buildozer.spec') }}-
            buildozer-

      - name: Установка Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython setuptools

      - name: Сборка APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Ошибка сборки (коротко)
        if: failure()
        run: |
          echo "===== ПОСЛЕДНИЕ 60 СТРОК ====="
          tail -n 60 build.log
          echo "===== СТРОКИ С ОШИБКАМИ ====="
          grep -nE "Traceback|Error:|error:|FAILED|FAILURE|Exception|fatal" build.log | tail -n 30 || true

      - name: Сохранить кэш Buildozer (даже после ошибки)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}

      - name: Полный лог
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: WinRun-apk
          path: bin/*.apk
